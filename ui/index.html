<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- WebView2 corre con --allow-file-access-from-files (lo exigen los módulos
       ES sobre file://), así que esta página puede leer archivos locales. La
       CSP es la red de seguridad para cuando entren nombres de estación y
       mercancía de EDDN y Spansh. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>LUNA</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/estado.css">
  <link rel="stylesheet" href="css/configuracion.css">
  <link rel="stylesheet" href="css/comercio.css">
</head>
<body>
  <div class="app">
    <nav class="lateral" data-i18n-aria-label="navegacion.etiqueta">
      <div class="lateral__marca">
        <svg class="lateral__luna" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"></path>
        </svg>
        <span class="lateral__nombre" data-i18n="app.nombre"></span>
      </div>
      <ul class="lateral__lista">
        <li>
          <button type="button" class="lateral__enlace" data-vista="estado" aria-current="page"
                  data-i18n-aria-label="navegacion.estado">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2.5"></circle></svg>
            <span data-i18n="navegacion.estado"></span>
          </button>
        </li>
        <li class="lateral__grupo" data-i18n="navegacion.comercio"></li>
        <li>
          <button type="button" class="lateral__enlace" data-vista="ahora"
                  data-i18n-aria-label="navegacion.ahora">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"></path><circle cx="12" cy="10" r="2"></circle></svg>
            <span data-i18n="navegacion.ahora"></span>
          </button>
        </li>
        <li>
          <button type="button" class="lateral__enlace" data-vista="rutas"
                  data-i18n-aria-label="navegacion.rutas">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="17" r="2.5"></circle><circle cx="18" cy="7" r="2.5"></circle><path d="M8 15.5 16 8.5"></path></svg>
            <span data-i18n="navegacion.rutas"></span>
          </button>
        </li>
        <li>
          <button type="button" class="lateral__enlace" data-vista="configuracion"
                  data-i18n-aria-label="navegacion.configuracion">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>
            <span data-i18n="navegacion.configuracion"></span>
          </button>
        </li>
      </ul>
    </nav>

    <main class="contenido">
      <section id="vista-estado" class="vista" aria-labelledby="titulo-estado">
        <header class="cabecera">
          <div class="cabecera__identidad">
            <h1 id="titulo-estado" class="cabecera__comandante" data-campo="comandante"></h1>
            <span class="etiqueta" data-campo="modo"></span>
          </div>
          <p class="cabecera__saldo" data-campo="saldo_bloque">
            <span class="cabecera__saldo-etiqueta" data-i18n="estado.saldo.etiqueta"></span>
            <span class="cifra" data-campo="saldo"></span>
          </p>
        </header>

        <p class="motivo" data-campo="comandante_motivo" hidden></p>

        <p class="franja franja--advertencia" role="alert" data-campo="franja" hidden></p>

        <div class="paneles" data-campo="paneles">
          <section class="panel" data-solo-live aria-labelledby="titulo-ubicacion">
            <h2 id="titulo-ubicacion" class="panel__titulo" data-i18n="estado.ubicacion.titulo"></h2>
            <p class="motivo" data-campo="ubicacion_motivo" hidden></p>
            <dl class="datos" data-campo="ubicacion_datos">
              <dt data-i18n="estado.ubicacion.sistema"></dt>
              <dd class="datos__con-accion">
                <span class="seleccionable" data-campo="sistema"></span>
                <button type="button" class="boton boton--vidrio" data-campo="copiar"
                        data-i18n="estado.ubicacion.copiar"
                        data-i18n-aria-label="estado.ubicacion.copiar_aria" hidden></button>
              </dd>
              <dt data-i18n="estado.ubicacion.estacion"></dt>
              <dd data-campo="estacion"></dd>
              <dt data-i18n="estado.ubicacion.coordenadas"></dt>
              <dd class="cifra" data-campo="coordenadas"></dd>
              <dt data-i18n="estado.ubicacion.al_centro"></dt>
              <dd data-campo="al_centro"></dd>
            </dl>
          </section>

          <section class="panel" data-solo-live aria-labelledby="titulo-nave">
            <h2 id="titulo-nave" class="panel__titulo" data-i18n="estado.nave.titulo"></h2>
            <p class="motivo" data-campo="nave_motivo" hidden></p>
            <dl class="datos" data-campo="nave_datos">
              <dt data-i18n="estado.nave.modelo"></dt>
              <dd data-campo="nave_modelo"></dd>
              <dt data-i18n="estado.nave.bodega"></dt>
              <dd class="cifra" data-campo="nave_bodega"></dd>
              <dt data-i18n="estado.nave.plataforma"></dt>
              <dd data-campo="nave_plataforma"></dd>
              <dt data-i18n="estado.nave.rango_vacia"></dt>
              <dd class="cifra" data-campo="nave_rango_vacia"></dd>
              <dt data-i18n="estado.nave.rango_cargada"></dt>
              <dd class="cifra" data-campo="nave_rango_cargada"></dd>
              <dt data-i18n="estado.nave.combustible"></dt>
              <dd class="cifra" data-campo="nave_combustible"></dd>
            </dl>
          </section>

          <section class="panel" data-solo-live aria-labelledby="titulo-carga">
            <h2 id="titulo-carga" class="panel__titulo" data-i18n="estado.carga.titulo"></h2>
            <p class="panel__resumen cifra" data-campo="carga_total"></p>
            <ul class="lista" data-campo="carga_lista"></ul>
            <p class="vacio" data-campo="carga_vacia" hidden></p>
          </section>

          <section class="panel" aria-labelledby="titulo-fuentes">
            <h2 id="titulo-fuentes" class="panel__titulo" data-i18n="estado.fuentes.titulo"></h2>
            <dl class="datos">
              <dt data-i18n="estado.fuentes.journal"></dt>
              <dd><span class="indicador" data-campo="fuente_journal"></span></dd>
              <dt data-i18n="estado.fuentes.eddn"></dt>
              <dd><span class="indicador indicador--apagado" data-campo="fuente_eddn"></span></dd>
              <dt data-i18n="estado.fuentes.spansh"></dt>
              <dd><span class="indicador indicador--apagado" data-campo="fuente_spansh"></span></dd>
            </dl>
          </section>
        </div>

        <ul class="avisos" data-campo="avisos"></ul>
      </section>

      <section id="vista-ahora" class="vista vista--ancha" aria-labelledby="titulo-ahora" hidden>
        <header class="cabecera">
          <h1 id="titulo-ahora" class="cabecera__comandante" data-i18n="comercio.ahora.titulo"></h1>
        </header>

        <div class="ahora">
          <div class="ahora__barra">
            <p class="motivo" role="status" data-campo="ahora_estado"></p>
            <button type="button" class="boton boton--vidrio" data-campo="ahora_actualizar" data-i18n="comercio.ahora.actualizar"></button>
          </div>
          <p class="franja franja--advertencia" role="alert" data-campo="ahora_error" hidden></p>

          <section class="panel ahora__seccion" aria-labelledby="titulo-vender">
            <h2 id="titulo-vender" class="panel__titulo" data-i18n="comercio.ahora.vender.titulo"></h2>
            <p class="motivo" data-i18n="comercio.ahora.vender.ayuda"></p>
            <p class="motivo" data-campo="vender_motivo" hidden></p>
            <div class="ahora__articulos" data-campo="vender_lista"></div>
          </section>

          <section class="panel ahora__seccion" aria-labelledby="titulo-desde-aqui">
            <h2 id="titulo-desde-aqui" class="panel__titulo" data-i18n="comercio.ahora.desde_aqui.titulo"></h2>
            <p class="motivo" data-campo="desde_aqui_motivo" hidden></p>
            <div class="tabla-contenedor" data-campo="desde_aqui_contenedor" hidden>
              <table class="tabla" data-campo="desde_aqui_tabla">
                <caption class="solo-lectores" data-i18n="comercio.ahora.desde_aqui.titulo"></caption>
                <thead></thead>
                <tbody></tbody>
              </table>
            </div>
          </section>

          <section class="panel detalle" data-campo="detalle" aria-labelledby="titulo-detalle-ahora" hidden>
            <h2 id="titulo-detalle-ahora" class="panel__titulo" data-i18n="comercio.rutas.detalle.titulo"></h2>
            <div class="detalle__tramos" data-campo="detalle_tramos"></div>
          </section>
        </div>
      </section>

      <section id="vista-rutas" class="vista vista--ancha" aria-labelledby="titulo-rutas" hidden>
        <header class="cabecera">
          <h1 id="titulo-rutas" class="cabecera__comandante" data-i18n="comercio.rutas.titulo"></h1>
        </header>

        <div class="rutas">
          <details class="plegable" data-campo="perfil_plegable" open>
          <summary class="plegable__titulo" data-i18n="comercio.perfil.plegar"></summary>
          <form class="perfil panel" data-panel="perfil" novalidate aria-labelledby="titulo-perfil">
            <h2 id="titulo-perfil" class="panel__titulo" data-i18n="comercio.perfil.titulo"></h2>
            <p class="motivo" data-campo="perfil_sin_nave" data-i18n="comercio.perfil.sin_nave" hidden></p>
            <fieldset class="grupo">
            <legend class="grupo__titulo" data-i18n="comercio.perfil.nave"></legend>
            <div class="campo">
              <div class="campo__cabecera">
                <label for="perfil-capacidad" data-i18n="comercio.perfil.capacidad"></label>
                <span class="marca" data-marca="capacidad" hidden></span>
              </div>
              <input id="perfil-capacidad" name="capacidad" class="entrada entrada--corta" type="number" min="1" max="5000" step="1" inputmode="decimal">
            </div>
            <div class="campo">
              <div class="campo__cabecera">
                <label for="perfil-rango" data-i18n="comercio.perfil.rango"></label>
                <span class="marca" data-marca="rango" hidden></span>
              </div>
              <input id="perfil-rango" name="rango" class="entrada entrada--corta" type="number" min="0.01" max="500" step="any" inputmode="decimal">
            </div>
            <div class="campo">
              <div class="campo__cabecera">
                <label for="perfil-plataforma" data-i18n="comercio.perfil.plataforma"></label>
                <span class="marca" data-marca="plataforma" hidden></span>
              </div>
              <select id="perfil-plataforma" name="plataforma" class="entrada entrada--corta"><option value="S" data-i18n="comercio.perfil.plataformas.S"></option><option value="M" data-i18n="comercio.perfil.plataformas.M"></option><option value="L" data-i18n="comercio.perfil.plataformas.L"></option></select>
            </div>
            <div class="campo">
              <div class="campo__cabecera">
                <label for="perfil-creditos" data-i18n="comercio.perfil.creditos"></label>
                <span class="marca" data-marca="creditos" hidden></span>
              </div>
              <input id="perfil-creditos" name="creditos" class="entrada entrada--corta" type="number" min="0" max="9007199254740992" step="1" inputmode="decimal" aria-describedby="perfil-creditos-ayuda">
              <p id="perfil-creditos-ayuda" class="motivo" data-i18n="comercio.perfil.creditos_ayuda"></p>
            </div>
            <div class="acciones">
              <button type="button" class="boton boton--vidrio" data-campo="perfil_restaurar"
                      data-i18n="comercio.perfil.restaurar"></button>
            </div>
            </fieldset>
            <fieldset class="grupo">
            <legend class="grupo__titulo" data-i18n="comercio.perfil.busqueda"></legend>
            <div class="campo">
              <div class="campo__cabecera">
                <label for="perfil-origen" data-i18n="comercio.perfil.origen"></label>
                <span class="marca" data-marca="origen" hidden></span>
              </div>
              <input id="perfil-origen" name="origen" class="entrada" type="text" maxlength="100" autocomplete="off" spellcheck="false">
            </div>
            <div class="campo">
              <label for="perfil-distancia_max_ly" data-i18n="comercio.perfil.distancia_max_ly"></label>
              <input id="perfil-distancia_max_ly" name="distancia_max_ly" class="entrada entrada--corta" type="number" min="0.01" max="1000" step="any" inputmode="decimal">
            </div>
            <div class="campo">
              <label for="perfil-distancia_max_ls" data-i18n="comercio.perfil.distancia_max_ls"></label>
              <input id="perfil-distancia_max_ls" name="distancia_max_ls" class="entrada entrada--corta" type="number" min="1" max="10000000" step="any" inputmode="decimal">
            </div>
            <div class="campo">
              <label for="perfil-antiguedad_max_h" data-i18n="comercio.perfil.antiguedad_max_h"></label>
              <input id="perfil-antiguedad_max_h" name="antiguedad_max_h" class="entrada entrada--corta" type="number" min="0.01" max="720" step="any" inputmode="decimal" aria-describedby="perfil-antiguedad_max_h-ayuda">
              <p id="perfil-antiguedad_max_h-ayuda" class="motivo" data-campo="perfil_antiguedad_ayuda"></p>
            </div>
            <div class="campo">
              <label for="perfil-stock_minimo_pct" data-i18n="comercio.perfil.stock_minimo_pct"></label>
              <input id="perfil-stock_minimo_pct" name="stock_minimo_pct" class="entrada entrada--corta" type="number" min="0" max="1000" step="any" inputmode="decimal">
            </div>
            <div class="campo">
              <label for="perfil-horas_sesion" data-i18n="comercio.perfil.horas_sesion"></label>
              <input id="perfil-horas_sesion" name="horas_sesion" class="entrada entrada--corta" type="number" min="0.01" max="24" step="any" inputmode="decimal">
            </div>
            <div class="campo">
              <label for="perfil-orden" data-i18n="comercio.perfil.orden"></label>
              <select id="perfil-orden" name="orden" class="entrada"><option value="ganancia_hora" data-i18n="comercio.perfil.ordenes.ganancia_hora"></option><option value="ganancia_viaje" data-i18n="comercio.perfil.ordenes.ganancia_viaje"></option><option value="ganancia_tonelada" data-i18n="comercio.perfil.ordenes.ganancia_tonelada"></option><option value="distancia" data-i18n="comercio.perfil.ordenes.distancia"></option></select>
            </div>
            </fieldset>
            <fieldset class="grupo">
            <legend class="grupo__titulo" data-i18n="comercio.perfil.datos"></legend>
            <fieldset class="casillas">
              <legend data-i18n="comercio.perfil.tipos"></legend>
              <label class="casilla"><input type="checkbox" name="tipos" value="orbital"><span data-i18n="comercio.perfil.tipo.orbital"></span></label>
              <label class="casilla"><input type="checkbox" name="tipos" value="puesto_avanzado"><span data-i18n="comercio.perfil.tipo.puesto_avanzado"></span></label>
              <label class="casilla"><input type="checkbox" name="tipos" value="puerto_planetario"><span data-i18n="comercio.perfil.tipo.puerto_planetario"></span></label>
              <label class="casilla"><input type="checkbox" name="tipos" value="asentamiento"><span data-i18n="comercio.perfil.tipo.asentamiento"></span></label>
              <label class="casilla"><input type="checkbox" name="tipos" value="colonizacion"><span data-i18n="comercio.perfil.tipo.colonizacion"></span></label>
              <label class="casilla casilla--apagada"><input type="checkbox" disabled><span data-i18n="comercio.perfil.fleet_carrier"></span></label>
            </fieldset>
            <fieldset class="casillas">
              <legend data-i18n="comercio.perfil.origenes"></legend>
              <label class="casilla"><input type="checkbox" name="origenes" value="propio"><span data-i18n="comercio.perfil.origen_dato.propio"></span></label>
              <label class="casilla"><input type="checkbox" name="origenes" value="eddn"><span data-i18n="comercio.perfil.origen_dato.eddn"></span></label>
              <label class="casilla"><input type="checkbox" name="origenes" value="spansh"><span data-i18n="comercio.perfil.origen_dato.spansh"></span></label>
            </fieldset>
            <label class="casilla"><input type="checkbox" name="raras"><span data-i18n="comercio.perfil.raras"></span></label>
            </fieldset>
            <p class="franja franja--advertencia" role="alert" data-campo="perfil_error" hidden></p>
            <p class="motivo" role="status" data-campo="perfil_aviso" hidden></p>
          </form>

          <section class="panel guardados" data-panel="guardados" aria-labelledby="titulo-guardados">
            <h2 id="titulo-guardados" class="panel__titulo" data-i18n="comercio.perfil.guardados.titulo"></h2>
            <p class="motivo" data-campo="guardados_ninguno" data-i18n="comercio.perfil.guardados.ninguno" hidden></p>
            <div class="campo" data-campo="guardados_eleccion">
              <label for="guardados-lista" data-i18n="comercio.perfil.guardados.lista"></label>
              <select id="guardados-lista" class="entrada" data-campo="guardados_lista"></select>
              <div class="acciones">
                <button type="button" class="boton boton--vidrio" data-campo="guardados_cargar"
                        data-i18n="comercio.perfil.guardados.cargar"></button>
                <button type="button" class="boton boton--vidrio" data-campo="guardados_borrar"
                        data-i18n="comercio.perfil.guardados.borrar"></button>
              </div>
            </div>
            <form class="campo" data-campo="guardados_formulario" novalidate>
              <label for="guardados-nombre" data-i18n="comercio.perfil.guardados.nombre"></label>
              <input id="guardados-nombre" class="entrada" type="text" maxlength="100" autocomplete="off"
                     data-campo="guardados_nombre">
              <div class="acciones">
                <button type="submit" class="boton boton--primario"
                        data-i18n="comercio.perfil.guardados.guardar"></button>
              </div>
            </form>
            <p class="franja franja--advertencia" role="alert" data-campo="guardados_error" hidden></p>
            <p class="motivo" role="status" data-campo="guardados_resultado" hidden></p>
          </section>
          </details>

          <section class="resultados" aria-labelledby="titulo-resultados">
            <h2 id="titulo-resultados" class="solo-lectores" data-i18n="comercio.rutas.tabla"></h2>
            <form class="busqueda" data-campo="busqueda_formulario" novalidate>
              <fieldset class="modos">
                <legend class="solo-lectores" data-i18n="comercio.rutas.modo"></legend>
                <label class="modo"><input type="radio" name="modo" value="un_salto" checked><span data-i18n="comercio.rutas.modos.un_salto"></span></label>
                <label class="modo"><input type="radio" name="modo" value="bucle"><span data-i18n="comercio.rutas.modos.bucle"></span></label>
              </fieldset>
              <button type="submit" class="boton boton--primario" data-i18n="comercio.rutas.buscar"></button>
            </form>
            <p class="motivo" role="status" data-campo="resultados_estado"></p>
            <p class="franja franja--advertencia" role="alert" data-campo="resultados_error" hidden></p>
            <div class="tabla-contenedor" data-campo="tabla_contenedor" hidden>
              <table class="tabla" data-campo="tabla">
                <caption class="solo-lectores" data-i18n="comercio.rutas.tabla"></caption>
                <thead data-campo="tabla_cabecera"></thead>
                <tbody data-campo="tabla_cuerpo"></tbody>
              </table>
            </div>
            <section class="panel detalle" data-campo="detalle" aria-labelledby="titulo-detalle" hidden>
              <h2 id="titulo-detalle" class="panel__titulo" data-i18n="comercio.rutas.detalle.titulo"></h2>
              <div class="detalle__tramos" data-campo="detalle_tramos"></div>
            </section>
          </section>
        </div>
      </section>

      <section id="vista-configuracion" class="vista" aria-labelledby="titulo-configuracion" hidden>
        <header class="cabecera">
          <h1 id="titulo-configuracion" class="cabecera__comandante" data-i18n="configuracion.titulo"></h1>
        </header>

        <section class="panel panel--ancho" aria-labelledby="titulo-config-journal">
          <h2 id="titulo-config-journal" class="panel__titulo" data-i18n="configuracion.journal.titulo"></h2>
          <p class="ayuda" data-i18n="configuracion.journal.ayuda"></p>
          <dl class="datos">
            <dt data-i18n="configuracion.journal.carpeta"></dt>
            <dd class="seleccionable" data-campo="config_journal"></dd>
            <dt data-i18n="configuracion.journal.origen"></dt>
            <dd data-campo="config_origen"></dd>
          </dl>
          <p class="franja franja--advertencia" data-campo="config_no_existe" hidden></p>
          <p class="franja franja--advertencia" role="alert" data-campo="config_no_guardado" hidden></p>
          <div class="acciones">
            <button type="button" class="boton boton--primario" data-campo="elegir_carpeta"
                    data-i18n="configuracion.journal.elegir"></button>
            <button type="button" class="boton boton--vidrio" data-campo="carpeta_automatica"
                    data-i18n="configuracion.journal.automatica"></button>
          </div>
        </section>

        <section class="panel panel--ancho" aria-labelledby="titulo-config-esfera" data-panel="esfera">
          <h2 id="titulo-config-esfera" class="panel__titulo" data-i18n="configuracion.esfera.titulo"></h2>
          <p class="ayuda" data-i18n="configuracion.esfera.ayuda"></p>
          <dl class="datos">
            <dt data-i18n="configuracion.esfera.actual"></dt>
            <dd data-campo="esfera_actual"></dd>
          </dl>
          <form class="formulario" data-campo="esfera_formulario" novalidate>
            <div class="campo">
              <label for="esfera-centro" data-i18n="configuracion.esfera.centro"></label>
              <input id="esfera-centro" class="entrada" type="text" maxlength="100"
                     autocomplete="off" spellcheck="false" data-campo="esfera_centro"
                     aria-describedby="esfera-centro-ayuda">
              <p id="esfera-centro-ayuda" class="motivo" data-i18n="configuracion.esfera.centro_ayuda"></p>
            </div>
            <div class="campo">
              <label for="esfera-radio" data-i18n="configuracion.esfera.radio"></label>
              <input id="esfera-radio" class="entrada entrada--corta" type="number" min="1"
                     max="100000" step="any" inputmode="decimal" data-campo="esfera_radio">
            </div>
            <p class="franja franja--advertencia" role="alert" data-campo="esfera_error" hidden></p>
            <div class="acciones">
              <button type="submit" class="boton boton--primario" data-campo="esfera_revisar"
                      data-i18n="configuracion.esfera.revisar"></button>
            </div>
          </form>
          <div class="propuesta" data-campo="esfera_propuesta" hidden>
            <h3 class="propuesta__titulo" data-i18n="configuracion.esfera.propuesta.titulo"></h3>
            <p data-campo="propuesta_resumen"></p>
            <p data-campo="propuesta_descarga"></p>
            <p data-campo="propuesta_borrado" hidden></p>
            <p class="franja franja--advertencia" data-campo="propuesta_aviso" hidden></p>
            <div class="acciones">
              <button type="button" class="boton boton--primario" data-campo="propuesta_confirmar"></button>
              <button type="button" class="boton boton--vidrio" data-campo="propuesta_alternativa" hidden></button>
              <button type="button" class="boton boton--vidrio" data-campo="propuesta_cancelar"
                      data-i18n="configuracion.esfera.propuesta.cancelar"></button>
            </div>
          </div>
          <p class="motivo" role="status" data-campo="esfera_resultado" hidden></p>
        </section>

        <section class="panel panel--ancho" aria-labelledby="titulo-config-spansh" data-panel="spansh">
          <h2 id="titulo-config-spansh" class="panel__titulo" data-i18n="configuracion.spansh.titulo"></h2>
          <p class="ayuda" data-i18n="configuracion.spansh.ayuda"></p>
          <dl class="datos">
            <dt data-i18n="configuracion.spansh.fase_etiqueta"></dt>
            <dd><span class="indicador indicador--apagado" data-campo="spansh_fase"></span></dd>
            <dt data-i18n="configuracion.spansh.ultima_etiqueta"></dt>
            <dd data-campo="spansh_ultima"></dd>
          </dl>
          <progress class="barra" max="1" value="0" data-campo="spansh_barra"
                    data-i18n-aria-label="configuracion.spansh.barra_aria" hidden></progress>
          <p class="cifra" data-campo="spansh_progreso" hidden></p>
          <p class="franja franja--advertencia" role="alert" data-campo="spansh_error" hidden></p>
          <div class="acciones">
            <button type="button" class="boton boton--primario" data-campo="spansh_descargar"
                    data-i18n="configuracion.spansh.descargar" hidden></button>
            <button type="button" class="boton boton--vidrio" data-campo="spansh_pausar"
                    data-i18n="configuracion.spansh.pausar" hidden></button>
            <button type="button" class="boton boton--primario" data-campo="spansh_reanudar"
                    data-i18n="configuracion.spansh.reanudar" hidden></button>
            <button type="button" class="boton boton--vidrio" data-campo="spansh_cancelar"
                    data-i18n="configuracion.spansh.cancelar" hidden></button>
          </div>
        </section>

        <section class="panel panel--ancho" aria-labelledby="titulo-config-retencion" data-panel="retencion">
          <h2 id="titulo-config-retencion" class="panel__titulo" data-i18n="configuracion.retencion.titulo"></h2>
          <p class="ayuda" data-i18n="configuracion.retencion.ayuda"></p>
          <form class="formulario" data-campo="retencion_formulario" novalidate>
            <div class="campo">
              <label for="retencion-visitados" data-i18n="configuracion.retencion.visitados"></label>
              <input id="retencion-visitados" class="entrada entrada--corta" type="number" min="0"
                     max="365" step="any" inputmode="decimal" data-campo="retencion_visitados">
            </div>
            <div class="campo">
              <label for="retencion-antiguedad" data-i18n="configuracion.retencion.antiguedad"></label>
              <input id="retencion-antiguedad" class="entrada entrada--corta" type="number" min="0"
                     max="365" step="any" inputmode="decimal" data-campo="retencion_antiguedad">
            </div>
            <p class="franja franja--advertencia" role="alert" data-campo="retencion_error" hidden></p>
            <div class="acciones">
              <button type="submit" class="boton boton--primario"
                      data-i18n="configuracion.retencion.guardar"></button>
            </div>
          </form>
          <p class="motivo" role="status" data-campo="retencion_resultado" hidden></p>
        </section>

        <section class="panel panel--ancho" aria-labelledby="titulo-config-comercio" data-panel="comercio">
          <h2 id="titulo-config-comercio" class="panel__titulo" data-i18n="configuracion.comercio.titulo"></h2>
          <p class="ayuda" data-i18n="configuracion.comercio.ayuda"></p>
          <form class="formulario" data-campo="comercio_formulario" novalidate>
            <div class="campo">
              <label for="comercio-tope" data-i18n="configuracion.comercio.tope"></label>
              <input id="comercio-tope" class="entrada entrada--corta" type="number" min="1"
                     max="30" step="1" inputmode="numeric" data-campo="comercio_tope"
                     aria-describedby="comercio-tope-ayuda">
              <p id="comercio-tope-ayuda" class="ayuda" data-campo="comercio_tope_ayuda"></p>
            </div>
            <fieldset class="casillas" data-campo="comercio_tipos">
              <legend data-i18n="configuracion.comercio.tipos"></legend>
              <label class="casilla"><input type="checkbox" name="tipos" value="orbital"><span data-i18n="comercio.perfil.tipo.orbital"></span></label>
              <label class="casilla"><input type="checkbox" name="tipos" value="puesto_avanzado"><span data-i18n="comercio.perfil.tipo.puesto_avanzado"></span></label>
              <label class="casilla"><input type="checkbox" name="tipos" value="puerto_planetario"><span data-i18n="comercio.perfil.tipo.puerto_planetario"></span></label>
              <label class="casilla"><input type="checkbox" name="tipos" value="asentamiento"><span data-i18n="comercio.perfil.tipo.asentamiento"></span></label>
              <label class="casilla"><input type="checkbox" name="tipos" value="colonizacion"><span data-i18n="comercio.perfil.tipo.colonizacion"></span></label>
            </fieldset>
            <p class="ayuda" data-i18n="configuracion.comercio.fleet_carrier"></p>
            <p class="franja franja--advertencia" role="alert" data-campo="comercio_error" hidden></p>
            <div class="acciones">
              <button type="submit" class="boton boton--primario"
                      data-i18n="configuracion.comercio.guardar"></button>
            </div>
          </form>
          <p class="motivo" role="status" data-campo="comercio_resultado" hidden></p>
        </section>

        <section class="panel panel--ancho" aria-labelledby="titulo-config-eddn" data-panel="eddn">
          <h2 id="titulo-config-eddn" class="panel__titulo" data-i18n="configuracion.eddn.titulo"></h2>
          <p class="ayuda" data-i18n="configuracion.eddn.ayuda"></p>
          <label class="casilla" for="eddn-activado">
            <input id="eddn-activado" type="checkbox" data-campo="eddn_activado">
            <span data-i18n="configuracion.eddn.activar"></span>
          </label>
          <p class="motivo" data-campo="eddn_sin_base" data-i18n="configuracion.eddn.sin_base" hidden></p>
          <p class="franja franja--advertencia" role="alert" data-campo="eddn_error" hidden></p>
        </section>

        <section class="panel panel--ancho" aria-labelledby="titulo-config-datos">
          <h2 id="titulo-config-datos" class="panel__titulo" data-i18n="configuracion.datos.titulo"></h2>
          <dl class="datos">
            <dt data-i18n="configuracion.datos.carpeta"></dt>
            <dd class="seleccionable" data-campo="config_datos"></dd>
          </dl>
        </section>
      </section>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
