<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- WebView2 corre con --allow-file-access-from-files (lo exigen los módulos
       ES sobre file://), así que esta página puede leer archivos locales. La
       CSP es la red de seguridad para cuando entren nombres de estación y
       mercancía de EDDN y Spansh. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>LUNA</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/estado.css">
  <link rel="stylesheet" href="css/configuracion.css">
  <link rel="stylesheet" href="css/comercio.css">
  <link rel="stylesheet" href="css/lunar.css">
</head>
<body>
  <div class="app">
    <nav class="lateral" data-i18n-aria-label="navegacion.etiqueta" data-i18n-title="navegacion.etiqueta">
      <div class="lateral__marca">
        <svg class="lateral__luna" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"></path>
        </svg>
        <span class="lateral__nombre" data-i18n="app.nombre"></span>
      </div>
      <ul class="lateral__lista">
        <li>
          <button type="button" class="lateral__enlace" data-vista="estado" aria-current="page"
                  data-i18n-aria-label="navegacion.estado" data-i18n-title="navegacion.estado">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2.5"></circle></svg>
            <span data-i18n="navegacion.estado"></span>
          </button>
        </li>
        <li class="lateral__grupo" data-i18n="navegacion.comercio"></li>
        <li>
          <button type="button" class="lateral__enlace" data-vista="ahora"
                  data-i18n-aria-label="navegacion.ahora" data-i18n-title="navegacion.ahora">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"></path><circle cx="12" cy="10" r="2"></circle></svg>
            <span data-i18n="navegacion.ahora"></span>
          </button>
        </li>
        <li>
          <button type="button" class="lateral__enlace" data-vista="rutas"
                  data-i18n-aria-label="navegacion.rutas" data-i18n-title="navegacion.rutas">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="17" r="2.5"></circle><circle cx="18" cy="7" r="2.5"></circle><path d="M8 15.5 16 8.5"></path></svg>
            <span data-i18n="navegacion.rutas"></span>
          </button>
        </li>
        <li>
          <button type="button" class="lateral__enlace" data-vista="fijadas"
                  data-i18n-aria-label="navegacion.fijadas" data-i18n-title="navegacion.fijadas">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8l-1 6 3 3v2H6v-2l3-3z"></path><path d="M12 15v6"></path></svg>
            <span data-i18n="navegacion.fijadas"></span>
          </button>
        </li>
        <li>
          <button type="button" class="lateral__enlace" data-vista="alertas"
                  data-i18n-aria-label="navegacion.alertas" data-i18n-title="navegacion.alertas">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20.5a2 2 0 0 0 4 0"></path></svg>
            <span data-i18n="navegacion.alertas"></span>
          </button>
        </li>
        <li>
          <button type="button" class="lateral__enlace" data-vista="rendimiento"
                  data-i18n-aria-label="navegacion.rendimiento" data-i18n-title="navegacion.rendimiento">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19v-7M12 19V5M19 19v-10M3 21h18"></path></svg>
            <span data-i18n="navegacion.rendimiento"></span>
          </button>
        </li>
        <li>
          <button type="button" class="lateral__enlace" data-vista="configuracion"
                  data-i18n-aria-label="navegacion.configuracion" data-i18n-title="navegacion.configuracion">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>
            <span data-i18n="navegacion.configuracion"></span>
          </button>
        </li>
      </ul>
      <button type="button" class="lateral__plegar" data-campo="lateral_plegar" aria-expanded="true"
              data-i18n-aria-label="navegacion.plegar" data-i18n-title="navegacion.plegar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6l-6 6 6 6"></path></svg>
      </button>
    </nav>

    <main class="contenido">
      <section id="vista-estado" class="vista" aria-labelledby="titulo-estado">
        <div class="vista__fija">
        <header class="cabecera">
          <div class="cabecera__identidad">
            <h1 id="titulo-estado" class="cabecera__comandante" data-campo="comandante"></h1>
            <span class="etiqueta" data-campo="modo"></span>
          </div>
          <p class="cabecera__saldo" data-campo="saldo_bloque">
            <span class="cabecera__saldo-etiqueta" data-i18n="estado.saldo.etiqueta"></span>
            <span class="cifra" data-campo="saldo"></span>
          </p>
        </header>
        </div>

        <div class="vista__zona"><div class="vista__cuerpo">
        <p class="motivo" data-campo="comandante_motivo" hidden></p>

        <p class="franja franja--advertencia" role="alert" data-campo="franja" hidden></p>

        <div class="paneles" data-campo="paneles">
          <section class="panel" data-solo-live aria-labelledby="titulo-ubicacion">
            <h2 id="titulo-ubicacion" class="panel__titulo" data-i18n="estado.ubicacion.titulo"></h2>
            <p class="motivo" data-campo="ubicacion_motivo" hidden></p>
            <dl class="datos" data-campo="ubicacion_datos">
              <dt data-i18n="estado.ubicacion.sistema"></dt>
              <dd class="datos__con-accion">
                <span class="seleccionable" data-campo="sistema"></span>
                <button type="button" class="boton boton--vidrio" data-campo="copiar"
                        data-i18n="estado.ubicacion.copiar"
                        data-i18n-aria-label="estado.ubicacion.copiar_aria" hidden></button>
              </dd>
              <dt data-i18n="estado.ubicacion.estacion"></dt>
              <dd data-campo="estacion"></dd>
              <dt data-i18n="estado.ubicacion.coordenadas"></dt>
              <dd class="cifra" data-campo="coordenadas"></dd>
              <dt data-i18n="estado.ubicacion.al_centro"></dt>
              <dd data-campo="al_centro"></dd>
            </dl>
          </section>

          <section class="panel" data-solo-live aria-labelledby="titulo-nave">
            <h2 id="titulo-nave" class="panel__titulo" data-i18n="estado.nave.titulo"></h2>
            <p class="motivo" data-campo="nave_motivo" hidden></p>
            <dl class="datos" data-campo="nave_datos">
              <dt data-i18n="estado.nave.modelo"></dt>
              <dd data-campo="nave_modelo"></dd>
              <dt data-i18n="estado.nave.bodega"></dt>
              <dd class="cifra" data-campo="nave_bodega"></dd>
              <dt data-i18n="estado.nave.plataforma"></dt>
              <dd data-campo="nave_plataforma"></dd>
              <dt data-i18n="estado.nave.rango_vacia"></dt>
              <dd class="cifra" data-campo="nave_rango_vacia"></dd>
              <dt data-i18n="estado.nave.rango_cargada"></dt>
              <dd class="cifra" data-campo="nave_rango_cargada"></dd>
              <dt data-i18n="estado.nave.combustible"></dt>
              <dd class="cifra" data-campo="nave_combustible"></dd>
            </dl>
          </section>

          <section class="panel" data-solo-live aria-labelledby="titulo-carga">
            <h2 id="titulo-carga" class="panel__titulo" data-i18n="estado.carga.titulo"></h2>
            <p class="panel__resumen cifra" data-campo="carga_total"></p>
            <ul class="lista" data-campo="carga_lista"></ul>
            <p class="vacio" data-campo="carga_vacia" hidden></p>
          </section>

          <section class="panel" aria-labelledby="titulo-fuentes">
            <h2 id="titulo-fuentes" class="panel__titulo" data-i18n="estado.fuentes.titulo"></h2>
            <dl class="datos">
              <dt data-i18n="estado.fuentes.journal"></dt>
              <dd><span class="indicador" data-campo="fuente_journal"></span></dd>
              <dt data-i18n="estado.fuentes.eddn"></dt>
              <dd><span class="indicador indicador--apagado" data-campo="fuente_eddn"></span></dd>
              <dt data-i18n="estado.fuentes.spansh"></dt>
              <dd><span class="indicador indicador--apagado" data-campo="fuente_spansh"></span></dd>
            </dl>
          </section>
        </div>

        <ul class="avisos" data-campo="avisos"></ul>
        </div></div>
      </section>

      <section id="vista-bienvenida" class="vista bienvenida" aria-labelledby="titulo-bienvenida" hidden>
        <div class="vista__fija">
        <header class="cabecera">
          <h1 id="titulo-bienvenida" class="cabecera__comandante" data-i18n="bienvenida.titulo"></h1>
        </header>
        <p class="bienvenida__entrada" data-i18n="bienvenida.entrada"></p>
        </div>

        <div class="vista__zona"><div class="vista__cuerpo">
        <section class="panel" aria-labelledby="titulo-bienvenida-journal">
          <h2 id="titulo-bienvenida-journal" class="panel__titulo" data-i18n="bienvenida.journal.titulo"></h2>
          <p role="status"><span class="indicador" data-campo="bienvenida_indicador"></span><span data-campo="bienvenida_journal"></span></p>
          <div class="acciones" data-campo="bienvenida_elegir_bloque" hidden>
            <button type="button" class="boton boton--vidrio" data-campo="bienvenida_elegir"></button>
          </div>
          <p class="franja franja--advertencia" role="alert" data-campo="bienvenida_no_guardado" data-i18n="configuracion.journal.no_guardado" hidden></p>
        </section>

        <section class="panel" aria-labelledby="titulo-bienvenida-datos">
          <h2 id="titulo-bienvenida-datos" class="panel__titulo" data-i18n="bienvenida.datos.titulo"></h2>
          <p data-i18n="bienvenida.datos.esfera"></p>
          <p data-i18n="bienvenida.datos.spansh"></p>
          <p data-i18n="bienvenida.datos.sin_descargar"></p>
          <div class="acciones">
            <button type="button" class="boton boton--primario" data-campo="bienvenida_descargar" data-i18n="bienvenida.datos.descargar"></button>
            <button type="button" class="boton boton--vidrio" data-campo="bienvenida_eddn" data-i18n="bienvenida.datos.eddn"></button>
          </div>
          <p class="ayuda" data-i18n="bienvenida.historial"></p>
        </section>
        </div></div>
      </section>

      <section id="vista-ahora" class="vista vista--ancha" aria-labelledby="titulo-ahora" hidden>
        <div class="vista__fija">
        <header class="cabecera">
          <h1 id="titulo-ahora" class="cabecera__comandante" data-i18n="comercio.ahora.titulo"></h1>
        </header>
        <div class="ahora__barra">
          <p class="motivo" role="status" data-campo="ahora_estado"></p>
          <button type="button" class="boton boton--vidrio" data-campo="ahora_actualizar" data-i18n="comercio.ahora.actualizar"></button>
        </div>
        </div>

        <div class="vista__zona"><div class="vista__cuerpo">
        <div class="ahora">
          <p class="franja franja--advertencia" role="alert" data-campo="ahora_error" hidden></p>

          <section class="panel ahora__seccion" aria-labelledby="titulo-vender">
            <h2 id="titulo-vender" class="panel__titulo" data-i18n="comercio.ahora.vender.titulo"></h2>
            <p class="motivo" data-i18n="comercio.ahora.vender.ayuda"></p>
            <p class="motivo" data-campo="vender_motivo" hidden></p>
            <div class="ahora__articulos" data-campo="vender_lista"></div>
          </section>

          <section class="panel ahora__seccion" aria-labelledby="titulo-desde-aqui">
            <h2 id="titulo-desde-aqui" class="panel__titulo" data-i18n="comercio.ahora.desde_aqui.titulo"></h2>
            <p class="motivo" data-campo="desde_aqui_motivo" hidden></p>
            <div class="tabla-contenedor" data-campo="desde_aqui_contenedor" hidden>
              <table class="tabla" data-campo="desde_aqui_tabla">
                <caption class="solo-lectores" data-i18n="comercio.ahora.desde_aqui.titulo"></caption>
                <thead></thead>
                <tbody></tbody>
              </table>
            </div>
          </section>

          <section class="panel detalle" data-campo="detalle" aria-labelledby="titulo-detalle-ahora" hidden>
            <h2 id="titulo-detalle-ahora" class="panel__titulo" data-i18n="comercio.rutas.detalle.titulo"></h2>
            <div class="detalle__cuerpo" data-campo="detalle_tramos"></div>
          </section>
        </div>
        </div></div>
      </section>

      <section id="vista-rutas" class="vista vista--ancha" aria-labelledby="titulo-rutas" hidden>
        <div class="vista__fija">
        <header class="cabecera">
          <h1 id="titulo-rutas" class="cabecera__comandante" data-i18n="comercio.rutas.titulo"></h1>
        </header>
        <form class="busqueda" data-campo="busqueda_formulario" novalidate>
            <fieldset class="modos">
              <legend class="solo-lectores" data-i18n="comercio.rutas.modo"></legend>
              <label class="modo"><input type="radio" name="modo" value="un_salto" checked><span data-i18n="comercio.rutas.modos.un_salto"></span></label>
              <label class="modo"><input type="radio" name="modo" value="bucle"><span data-i18n="comercio.rutas.modos.bucle"></span></label>
              <label class="modo"><input type="radio" name="modo" value="cadena"><span data-i18n="comercio.rutas.modos.cadena"></span></label>
              <label class="modo"><input type="radio" name="modo" value="circuito"><span data-i18n="comercio.rutas.modos.circuito"></span></label>
            </fieldset>
            <div class="paradas-campo" data-campo="paradas_campo" hidden>
              <label for="rutas-paradas" data-i18n="comercio.rutas.paradas"></label>
              <select id="rutas-paradas" class="entrada" data-campo="paradas" aria-describedby="rutas-paradas-ayuda"></select>
              <p id="rutas-paradas-ayuda" class="motivo" data-campo="paradas_ayuda"></p>
            </div>
            <button type="submit" class="boton boton--primario" data-i18n="comercio.rutas.buscar"></button>
        </form>
        <details class="plegable filtros" data-campo="perfil_plegable">
          <summary class="plegable__titulo" data-i18n="comercio.perfil.plegar"></summary>
          <div class="filtros__cuerpo">
          <form class="perfil" data-panel="perfil" novalidate data-i18n-aria-label="comercio.perfil.titulo">
            <p class="motivo" data-campo="perfil_sin_nave" data-i18n="comercio.perfil.sin_nave" hidden></p>
            <fieldset class="grupo grupo--busqueda">
              <legend class="solo-lectores" data-i18n="comercio.perfil.busqueda"></legend>
              <div class="campo">
                <div class="campo__cabecera">
                  <label for="perfil-origen" data-i18n="comercio.perfil.origen"></label>
                  <span class="marca" data-marca="origen" hidden></span>
                </div>
                <input id="perfil-origen" name="origen" class="entrada" type="text" maxlength="100" autocomplete="off" spellcheck="false">
              </div>
              <div class="campo">
                <label for="perfil-distancia_max_ly" data-i18n="comercio.perfil.distancia_max_ly"></label>
                <input id="perfil-distancia_max_ly" name="distancia_max_ly" class="entrada entrada--corta" type="number" min="0.01" max="1000" step="any" inputmode="decimal">
              </div>
              <div class="campo">
                <label for="perfil-distancia_max_ls" data-i18n="comercio.perfil.distancia_max_ls"></label>
                <input id="perfil-distancia_max_ls" name="distancia_max_ls" class="entrada entrada--corta" type="number" min="1" max="10000000" step="any" inputmode="decimal">
              </div>
              <div class="campo campo--deslizador">
                <label for="perfil-antiguedad_max_h" data-i18n="comercio.perfil.antiguedad_max_h"></label>
                <input id="perfil-antiguedad_max_h" name="antiguedad_max_h" type="range" min="0" max="9" step="1">
                <output class="deslizador__valor" data-campo="perfil_antiguedad_valor" for="perfil-antiguedad_max_h"></output>
              </div>
              <div class="campo">
                <div class="campo__cabecera">
                  <label for="perfil-stock_minimo" data-i18n="comercio.perfil.stock_minimo"></label>
                  <span class="marca" data-marca="stock_minimo" hidden></span>
                </div>
                <input id="perfil-stock_minimo" name="stock_minimo" class="entrada entrada--corta" type="text" inputmode="numeric" autocomplete="off" aria-describedby="perfil-stock_minimo-ayuda">
                <p id="perfil-stock_minimo-ayuda" class="motivo" data-campo="perfil_stock_equivale"></p>
              </div>
              <div class="campo">
                <label for="perfil-ganancia_min" data-i18n="comercio.perfil.ganancia_min"></label>
                <input id="perfil-ganancia_min" name="ganancia_min" class="entrada entrada--corta" type="text" inputmode="numeric" autocomplete="off">
              </div>
              <div class="campo campo--deslizador">
                <label for="perfil-horas_sesion" data-i18n="comercio.perfil.horas_sesion"></label>
                <input id="perfil-horas_sesion" name="horas_sesion" type="range" min="1" max="12" step="1">
                <output class="deslizador__valor" data-campo="perfil_horas_valor" for="perfil-horas_sesion"></output>
              </div>
              <div class="campo">
                <label for="perfil-orden" data-i18n="comercio.perfil.orden"></label>
                <select id="perfil-orden" name="orden" class="entrada"><option value="ganancia_hora" data-i18n="comercio.perfil.ordenes.ganancia_hora"></option><option value="ganancia_viaje" data-i18n="comercio.perfil.ordenes.ganancia_viaje"></option><option value="ganancia_tonelada" data-i18n="comercio.perfil.ordenes.ganancia_tonelada"></option><option value="distancia" data-i18n="comercio.perfil.ordenes.distancia"></option></select>
              </div>
            </fieldset>
            <details class="grupo-plegable" name="grupo-barra">
              <summary class="grupo__titulo" data-i18n="comercio.perfil.datos"></summary>
              <div class="grupo-plegable__cuerpo">
                <fieldset class="casillas">
                  <legend data-i18n="comercio.perfil.tipos"></legend>
                  <label class="casilla"><input type="checkbox" name="tipos" value="orbital"><span data-i18n="comercio.perfil.tipo.orbital"></span></label>
                  <label class="casilla"><input type="checkbox" name="tipos" value="puesto_avanzado"><span data-i18n="comercio.perfil.tipo.puesto_avanzado"></span></label>
                  <label class="casilla"><input type="checkbox" name="tipos" value="puerto_planetario"><span data-i18n="comercio.perfil.tipo.puerto_planetario"></span></label>
                  <label class="casilla"><input type="checkbox" name="tipos" value="asentamiento"><span data-i18n="comercio.perfil.tipo.asentamiento"></span></label>
                  <label class="casilla"><input type="checkbox" name="tipos" value="colonizacion"><span data-i18n="comercio.perfil.tipo.colonizacion"></span></label>
                  <label class="casilla casilla--apagada"><input type="checkbox" disabled><span data-i18n="comercio.perfil.fleet_carrier"></span></label>
                </fieldset>
                <fieldset class="casillas">
                  <legend data-i18n="comercio.perfil.origenes"></legend>
                  <label class="casilla"><input type="checkbox" name="origenes" value="propio"><span data-i18n="comercio.perfil.origen_dato.propio"></span></label>
                  <label class="casilla"><input type="checkbox" name="origenes" value="eddn"><span data-i18n="comercio.perfil.origen_dato.eddn"></span></label>
                  <label class="casilla"><input type="checkbox" name="origenes" value="spansh"><span data-i18n="comercio.perfil.origen_dato.spansh"></span></label>
                </fieldset>
                <label class="casilla"><input type="checkbox" name="raras"><span data-i18n="comercio.perfil.raras"></span></label>
              </div>
            </details>
            <details class="grupo-plegable" name="grupo-barra">
              <summary class="grupo__titulo" data-i18n="comercio.perfil.nave"></summary>
              <div class="grupo-plegable__cuerpo">
                <div class="campo">
                  <div class="campo__cabecera">
                    <label for="perfil-capacidad" data-i18n="comercio.perfil.capacidad"></label>
                    <span class="marca" data-marca="capacidad" hidden></span>
                  </div>
                  <input id="perfil-capacidad" name="capacidad" class="entrada entrada--corta" type="number" min="1" max="5000" step="1" inputmode="decimal">
                </div>
                <div class="campo">
                  <div class="campo__cabecera">
                    <label for="perfil-rango" data-i18n="comercio.perfil.rango"></label>
                    <span class="marca" data-marca="rango" hidden></span>
                  </div>
                  <input id="perfil-rango" name="rango" class="entrada entrada--corta" type="number" min="0.01" max="500" step="any" inputmode="decimal">
                </div>
                <div class="campo">
                  <div class="campo__cabecera">
                    <label for="perfil-plataforma" data-i18n="comercio.perfil.plataforma"></label>
                    <span class="marca" data-marca="plataforma" hidden></span>
                  </div>

          <p class="ayuda" data-i18n="configuracion.datos.ayuda"></p>
          <dl class="datos">
            <dt data-i18n="configuracion.datos.carpeta"></dt>
            <dd class="seleccionable" data-campo="config_datos"></dd>
            <dt data-i18n="configuracion.datos.base"></dt>
            <dd data-campo="espacio_base"></dd>
            <dt data-i18n="configuracion.datos.descargas"></dt>
            <dd data-campo="espacio_descargas"></dd>
            <dt data-i18n="configuracion.datos.libre"></dt>
            <dd data-campo="espacio_libre"></dd>
            <dt data-i18n="configuracion.datos.version"></dt>
            <dd data-campo="config_version"></dd>
          </dl>
          <h3 class="campo__subtitulo" data-i18n="configuracion.borrar.titulo"></h3>
          <p class="ayuda" data-i18n="configuracion.borrar.ayuda"></p>
          <div class="acciones">
            <button type="button" class="boton boton--vidrio" data-campo="borrar_pedir"
                    aria-describedby="borrar-ocupado" data-i18n="configuracion.borrar.pedir"></button>
          </div>
          <p id="borrar-ocupado" class="motivo" data-campo="borrar_ocupado"
             data-i18n="configuracion.borrar.ocupado" hidden></p>
          <div class="propuesta" data-campo="borrar_confirmacion" role="alertdialog"
               aria-labelledby="borrar-titulo" hidden>
            <h3 id="borrar-titulo" class="propuesta__titulo" data-i18n="configuracion.borrar.confirmar_titulo"></h3>
            <p data-i18n="configuracion.borrar.se_pierde"></p>
            <p data-i18n="configuracion.borrar.se_conserva"></p>
            <p data-i18n="configuracion.borrar.despues"></p>
            <div class="acciones">
              <button type="button" class="boton boton--primario" data-campo="borrar_confirmar"
                      data-i18n="configuracion.borrar.confirmar"></button>
              <button type="button" class="boton boton--vidrio" data-campo="borrar_cancelar"
                      data-i18n="configuracion.borrar.cancelar"></button>
            </div>
          </div>
          <p class="franja franja--advertencia" role="alert" data-campo="borrar_error" hidden></p>
          <p class="motivo" role="status" data-campo="borrar_resultado" hidden></p>
          </div>
        </details>
        </div></div>
      </section>
    </main>

    <aside class="aviso-alerta" data-campo="aviso_alerta" aria-labelledby="aviso-alerta-titulo" hidden>
      <p id="aviso-alerta-titulo" class="aviso-alerta__titulo" data-i18n="comercio.alertas.aviso.titulo"></p>
      <p class="aviso-alerta__ruta" role="status" data-campo="aviso_texto"></p>
      <div class="acciones">
        <button type="button" class="boton boton--primario" data-campo="aviso_abrir"
                data-i18n="comercio.alertas.aviso.abrir"></button>
        <button type="button" class="boton boton--vidrio" data-campo="aviso_cerrar"
                data-i18n="comercio.alertas.aviso.cerrar"></button>
      </div>
    </aside>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
