<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- WebView2 corre con --allow-file-access-from-files (lo exigen los módulos
       ES sobre file://), así que esta página puede leer archivos locales. La
       CSP es la red de seguridad para cuando entren nombres de estación y
       mercancía de EDDN y Spansh. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>LUNA</title>
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <header class="barra">
    <h1 class="barra__nombre" data-texto="app.nombre"></h1>
    <p class="barra__descripcion" data-texto="app.descripcion"></p>
  </header>

  <main class="contenido">
    <section class="tarjeta" aria-labelledby="titulo-fase">
      <h2 id="titulo-fase" data-texto="fase0.encabezado"></h2>
      <p data-texto="fase0.explicacion"></p>
      <dl class="medidas">
        <dt data-texto="fase0.etiqueta_pantalla"></dt>
        <dd id="medida-ventana"></dd>
        <dt data-texto="fase0.etiqueta_escala"></dt>
        <dd id="medida-escala"></dd>
      </dl>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
